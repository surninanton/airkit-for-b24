# Демо кита на GitHub Pages: https://airkit.appb24.ru
name: Демо на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build:demo
      # автоинициализация кита (src/js/global.ts) не должна выпасть из сборки: без неё не оживают вкладки и data-b24-*
      - name: Проверка автоинициализации
        run: grep -lq "B24UI" dist-demo/assets/*.js || (echo "global.ts выпал из сборки демо — проверьте sideEffects в package.json" && exit 1)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
